name: Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frieza-clean:
    runs-on: [self-hosted, linux, eu-west-2]
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    - name: 🧹 Frieza
      uses: ./frieza-clean
      with:
          access_key: ${{ secrets.OSC_ACCESS_KEY }}
          secret_key: ${{ secrets.OSC_SECRET_KEY }}
          region: ${{ secrets.OSC_REGION }}
          post_script: |
            echo "Good bye World !"
    - name: ⬇️ Install octl
      run: |
        curl -L -o octl https://github.com/outscale/octl/releases/download/${{vars.OCTL_VERSION}}/octl_Linux_x86_64
        install octl /usr/local/bin
    - name: 🔐 Create default profile
      run: |
        octl profile add default --ak $OSC_ACCESS_KEY --sk $OSC_SECRET_KEY --region $OSC_REGION
      env:
        OSC_ACCESS_KEY: ${{secrets.OSC_ACCESS_KEY}}
        OSC_SECRET_KEY: ${{secrets.OSC_SECRET_KEY}}
        OSC_REGION: ${{secrets.OSC_REGION}}
    - name: 🏗️ Create test resource
      run: |
        octl iaas keypair create --name $GITHUB_SHA --jq .KeypairId
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frieza-clean
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    - name: ⬆️ Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
    - name: 📦 Install dependencies
      run: npm ci
    - name: 🏗️ Typecheck, test and package
      run: npm run all
    - name: 🧹 dist must be up to date
      working-directory: ${{ github.workspace }}
      run: |
        git add -A frieza-clean/dist
        git diff --cached --exit-code -- frieza-clean/dist
